name: Run analysis

on:
  push:
    branches: [main, v2-portfolio-strategy]
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Analysis on real data
        run: python run_analysis.py --out output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            output/
            data/
