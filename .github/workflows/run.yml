name: Temporary data run
on:
  push:
    branches: [results]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: |
          set -o pipefail
          mkdir -p results
          python run_analysis.py --refresh 2>&1 | tee results/run.log
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results data
          git commit -qm "Data run ${GITHUB_RUN_ID}" && git push origin HEAD:results
